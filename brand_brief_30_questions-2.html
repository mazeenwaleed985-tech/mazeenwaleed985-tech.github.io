<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Brief | استمارة اكتشاف الهوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18221f;--muted:#69746f;--paper:#f5f4ef;--card:#fffefa;--line:#e2e4dc;--accent:#c9f36a;--dark:#17231f;--soft:#eef3e4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Alexandria','Cairo',sans-serif;font-size:14px;line-height:1.9}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1000px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.4px}.mark{background:var(--dark);color:var(--accent);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px}.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:99px;background:#ffffff90}.hero{background:var(--dark);color:#fffefa;border-radius:26px;padding:clamp(24px,5vw,48px);position:relative;overflow:hidden;margin-bottom:22px}.hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #c9f36a33;border-radius:50%;left:-75px;top:-120px;box-shadow:0 0 0 35px #c9f36a0b,0 0 0 70px #c9f36a08}.eyebrow{color:#c9f36a;font-size:11px;font-weight:700;letter-spacing:1.5px}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.4;margin:10px 0 12px;font-weight:800;letter-spacing:-1.5px;max-width:700px}.hero p{color:#d0d8d2;max-width:650px;margin:0}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.pills span{border:1px solid #ffffff2b;padding:5px 11px;border-radius:99px;font-size:11px;color:#e5e9e5}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px;align-items:start}.side,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px}.side{padding:16px;position:sticky;top:15px}.side-title{font-size:12px;color:var(--muted);font-weight:700;margin:2px 8px 12px}.stage-nav{display:flex;flex-direction:column;gap:6px}.stage{display:flex;gap:11px;align-items:center;text-align:right;width:100%;padding:10px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted)}.stage .num{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#f0f1eb;color:#526059;font-weight:700;flex-shrink:0}.stage strong{display:block;color:var(--ink);font-size:12px}.stage small{display:block;font-size:10px}.stage.active{background:var(--soft);border-color:#dce8c5}.stage.active .num,.stage.done .num{background:var(--dark);color:var(--accent)}.stage.done{color:var(--ink)}.save-note{font-size:10px;color:var(--muted);border-top:1px solid var(--line);margin-top:16px;padding:14px 4px 0}.panel{padding:clamp(20px,4vw,36px);min-height:480px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:25px}.panel h2{font-size:24px;line-height:1.5;margin:0 0 6px;font-weight:800;letter-spacing:-.6px}.panel-head p{margin:0;color:var(--muted);font-size:12px}.stepcount{white-space:nowrap;border-radius:10px;background:#f0f1eb;padding:7px 10px;font-size:11px;font-weight:700}.field{padding:17px 0;border-top:1px solid var(--line)}.field:first-child{border-top:0}.qtitle{font-weight:700;font-size:14px;line-height:1.8;margin:0 0 5px}.qsub{font-size:11px;color:var(--muted);margin:0 0 12px}.required{color:#a14a3e}.textinput,textarea,select{width:100%;border:1px solid #dfe2d9;background:#fff;border-radius:12px;padding:13px 14px;outline:none;color:var(--ink);transition:.2s}.textinput:focus,textarea:focus,select:focus{border-color:#879f59;box-shadow:0 0 0 3px #c9f36a30}textarea{resize:vertical;min-height:90px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:white;cursor:pointer;transition:.15s;min-height:48px}.option:has(input:checked){border-color:#829b52;background:var(--soft)}.option input{accent-color:#25352a;margin:5px 0 0;flex-shrink:0;width:16px;height:16px}.option span{font-size:12px;font-weight:600}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--dark);color:white}.btn.primary em{color:var(--accent);font-style:normal}.btn.secondary{background:#f0f1eb;color:var(--ink)}.btn:disabled{opacity:.35;cursor:not-allowed}.progress-wrap{margin:0 0 18px}.progress-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}.progress{height:6px;background:#e4e6de;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--dark);border-radius:99px;transition:width .25s}.intro-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.review-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.review-item b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.review-item span{white-space:pre-wrap;font-size:12px}.review-stage{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font-weight:800}.review-stage button{background:transparent;border:0;color:#4e6b26;font-size:11px;font-weight:700;text-decoration:underline}.success{text-align:center;padding:40px 10px}.success .check{width:65px;height:65px;border-radius:22px;background:var(--soft);display:grid;place-items:center;font-size:30px;margin:0 auto 20px}.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:20px}.hide{display:none!important}.error{color:#a14a3e;font-size:11px;margin-top:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;padding:12px}.stage-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.stage{display:block;text-align:center;padding:8px 4px}.stage .num{margin:0 auto 5px}.stage strong{font-size:10px}.stage small{display:none}.save-note{display:none}.panel{min-height:unset}.options{grid-template-columns:1fr}.intro-fields{grid-template-columns:1fr}.hero{border-radius:20px}.top{margin-bottom:16px}.tag{font-size:9px}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="mark">B.</div><div>BRAND BRIEF <div style="font-size:10px;color:var(--muted);font-weight:500">استكشاف العلامة التجارية</div></div></div><div class="tag">استمارة اكتشاف الهوية · 2026</div></header>
<div class="progress-wrap"><div class="progress-top"><span id="progressLabel">جاهز نبدأ؟</span><span id="progressPercent">0%</span></div><div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="layout"><aside class="side"><div class="side-title">مراحل الاستمارة</div><nav class="stage-nav" id="stageNav"></nav><div class="save-note">يتم حفظ إجاباتك على نفس الجهاز تلقائيًا أثناء التعبئة.</div></aside><section class="panel" id="panel"></section></div>
<div class="foot">BRAND BRIEF · خُد وقتك في الإجابة، مفيش إجابة صح أو غلط.</div>
</main>
<script>
const stages=[
{title:"معلومات أساسية",desc:"خلّينا نتعرّف عليك وعلى نشاطك",range:[1,5],qs:[
{id:1,t:"إيه اسمك الكامل ورقم التواصل المفضل؟",sub:"هنستخدم البيانات دي للتواصل بخصوص المشروع.",type:"contact"},
{id:2,t:"إيه اسم البراند أو الشركة؟",sub:"اكتب الاسم بالطريقة اللي تحب يظهر بيها.",type:"text",ph:"اسم البراند"},
{id:3,t:"إيه مجال نشاطكم، وبتقدموا إيه تحديدًا؟",type:"textarea",ph:"احكي لنا عن النشاط والمنتجات أو الخدمات الأساسية"},
{id:4,t:"بقالكم قد إيه في السوق؟",type:"radio",opts:["لسه بنبدأ","أقل من سنتين","من سنتين لـ5 سنين","من 5 لـ10 سنين","أكتر من 10 سنين"]},
{id:5,t:"إيه أهم المنتجات أو الخدمات اللي عايزين نسلّط الضوء عليها؟",sub:"اذكر أهم 3 إلى 5 منتجات أو خدمات.",type:"textarea",ph:"1. …\n2. …\n3. …"}]},
{title:"الأهداف والاستراتيجية",desc:"نحدد المطلوب من الهوية والنجاح بالنسبة لكم",range:[6,10],qs:[
{id:6,t:"إيه السبب الرئيسي وراء طلب هوية جديدة؟",type:"checks",opts:["إطلاق براند جديد","تطوير هوية حالية","الوصول لجمهور جديد","إطلاق منتجات أو خدمات","التوسع أو فتح فروع","الظهور بشكل أكثر احترافية","حل مشكلة في الهوية الحالية","سبب آخر"]},
{id:7,t:"إيه أهم 3 أهداف عايزين تحققوها من المشروع؟",type:"textarea",ph:"مثال: زيادة الثقة، التميز عن المنافسين، رفع قيمة البراند"},
{id:8,t:"إيه اللي بيميزكم فعلًا عن المنافسين؟",sub:"الميزة اللي العميل يلاحظها ويستفيد منها.",type:"textarea",ph:"جودة، خدمة، خبرة، سرعة، تجربة مختلفة…"},
{id:9,t:"لو المشروع نجح جدًا، إيه التغيير اللي تتمنوا تشوفوه بعد سنة؟",type:"textarea",ph:"صف النتيجة اللي تعتبرها نجاحًا"},
{id:10,t:"إيه أهم رسالة أو وعد لازم الهوية توصّله للعميل؟",type:"textarea",ph:"إيه اللي لازم العميل يفهمه أو يحسّه من أول نظرة؟"}]},
{title:"الجمهور والمنافسون",desc:"نفهم مين بنخاطب وإزاي نتميّز",range:[11,15],qs:[
{id:11,t:"مين العميل المثالي بالنسبة لكم؟",sub:"اذكر العمر، المكان، الاهتمامات، والقدرة الشرائية إن أمكن.",type:"textarea",ph:"وصف مختصر للجمهور المستهدف"},
{id:12,t:"إيه أهم احتياج أو مشكلة بتساعدوا العميل يحلّها؟",type:"textarea",ph:"من وجهة نظر العميل، هو محتاجكم ليه؟"},
{id:13,t:"إيه الاعتراضات أو المخاوف اللي ممكن تمنع العميل من الشراء؟",type:"textarea",ph:"السعر، الثقة، المقارنة، عدم وضوح الخدمة…"},
{id:14,t:"مين أهم 3 منافسين مباشرين أو بدائل بيقارنكم العميل بيها؟",type:"textarea",ph:"أسماء أو روابط لو متاحة"},
{id:15,t:"إيه اللي يعجبكم أو ما يعجبكمش في طريقة ظهور المنافسين؟",type:"textarea",ph:"اذكر أمثلة على نقاط القوة أو الأشياء اللي تحب تتجنبها"}]},
{title:"الشخصية والاتجاه البصري",desc:"نحوّل إحساس البراند لاختيارات واضحة",range:[16,20],qs:[
{id:16,t:"اختار لحد 3 صفات تصف شخصية البراند.",type:"checks",max:3,opts:["فاخر وراقي","بسيط وواضح","جريء ولافت","ودود وقريب","رسمي وموثوق","عصري ومبتكر","مرح وحيوي","طبيعي وهادئ","تقني ومتطور"]},
{id:17,t:"إيه الانطباع اللي لازم العميل يحسّه أول ما يشوف البراند؟",type:"textarea",ph:"مثال: ثقة، جودة، راحة، تميّز، فخامة"},
{id:18,t:"إيه الكلمات أو الصفات اللي لازم الهوية تعبّر عنها، وإيه اللي لازم تتجنبه؟",type:"textarea",ph:"نحب: …\nنتجنب: …"},
{id:19,t:"أي اتجاه بصري أقرب لذوقكم؟",type:"checks",opts:["Minimal — بسيط ونظيف","Modern — عصري","Classic — كلاسيكي","Luxury — فاخر","Playful — مرح","Bold — جريء","Organic — طبيعي","مش محدد، محتاجين اقتراح"]},
{id:20,t:"هل فيه ألوان مفضلة أو ألوان ممنوع استخدامها؟",sub:"اكتب أسماء الألوان أو أكواد HEX لو متاحة.",type:"textarea",ph:"ألوان مفضلة / ألوان نتجنبها / سبب الاختيار"}]},
{title:"الهوية والتطبيقات",desc:"نحدد العناصر المطلوبة وطريقة الاستخدام",range:[21,25],qs:[
{id:21,t:"هل عندكم لوجو أو هوية حالية؟",type:"radio",opts:["لا، البراند جديد","عندنا لوجو فقط","عندنا هوية متكاملة","عندنا تصميمات متفرقة ونحتاج توحيدها"]},
{id:22,t:"إيه العناصر اللي لازم تفضل موجودة أو ما تتغيرش؟",type:"textarea",ph:"اسم، رمز، لون، شعار، عنصر له قيمة خاصة…"},
{id:23,t:"هل عندكم أمثلة أو براندات بتحبوها بصريًا؟ وليه؟",sub:"ممكن تكتب أسماء أو روابط.",type:"textarea",ph:"اسم البراند أو الرابط + إيه اللي عجبك فيه"},
{id:24,t:"فين هتستخدموا الهوية؟ اختار كل الاستخدامات المطلوبة.",type:"checks",opts:["السوشيال ميديا","الموقع الإلكتروني","المطبوعات والكروت","التغليف","اللافتات والفرع","زي الموظفين","العروض التقديمية","الإعلانات","أخرى"]},
{id:25,t:"إيه الملفات أو المخرجات اللي محتاجينها؟",type:"checks",opts:["لوجو رئيسي ونسخ بديلة","ألوان وخطوط الهوية","قواعد استخدام الهوية","قوالب سوشيال ميديا","مطبوعات وكروت","ملفات مفتوحة AI / EPS / SVG","PDF إرشادات الهوية","مخرجات أخرى"]}]},
{title:"التنفيذ والميزانية",desc:"نرتّب الأولويات ونجهّز الخطوات القادمة",range:[26,30],qs:[
{id:26,t:"إيه الميزانية التقريبية المخصصة للمشروع؟",type:"radio",opts:["أقل من 5,000 جنيه","5,000–15,000 جنيه","15,000–30,000 جنيه","30,000–60,000 جنيه","أكتر من 60,000 جنيه","لسه محتاجين نحدد"]},
{id:27,t:"إيه الموعد النهائي المفضل للتسليم؟",type:"text",ph:"مثال: 15 ديسمبر 2026 أو خلال 3 أسابيع"},
{id:28,t:"مين صاحب القرار النهائي في الموافقة على التصميم؟",sub:"اذكر الاسم أو الدور الوظيفي، ومن الأفضل جمع الملاحظات في شخص واحد.",type:"textarea",ph:"الاسم / الدور / وسيلة التواصل إن لزم"},
{id:29,t:"إيه توقعاتكم بخصوص المراجعات والتعديلات؟",type:"radio",opts:["جولة أو جولتان","3 جولات","نحتاج نناقش ده","فيه أكتر من صاحب قرار"]},
{id:30,t:"هل فيه أي تفاصيل أو ملاحظات إضافية لازم نعرفها قبل البداية؟",sub:"أي تجربة سابقة، حساسية تجاه عنصر معين، أو معلومة مؤثرة على المشروع.",type:"textarea",ph:"اكتب أي شيء لم تغطّه الأسئلة السابقة"}]}
];
let step=0,answers=JSON.parse(localStorage.getItem('brandBriefAnswers')||'{}'),client=JSON.parse(localStorage.getItem('brandBriefClient')||'{}'),review=false,finished=false;
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){localStorage.setItem('brandBriefAnswers',JSON.stringify(answers));localStorage.setItem('brandBriefClient',JSON.stringify(client));}
function totalAnswered(){let n=0;stages.forEach(g=>g.qs.forEach(q=>{if(q.type==='contact'){if(client.name||client.phone)n++}else if(answers[q.id]!==undefined&&(Array.isArray(answers[q.id])?answers[q.id].length>0:String(answers[q.id]).trim()!==''))n++}));return n;}
function renderNav(){ $('#stageNav').innerHTML=stages.map((g,i)=>`<button class="stage ${i===step&&!review?'active':''} ${i<step?'done':''}" onclick="go(${i})"><span class="num">${i<step?'✓':String(i+1).padStart(2,'0')}</span><span><strong>${g.title}</strong><small>الأسئلة ${g.range[0]}–${g.range[1]}</small></span></button>`).join('');}
function updateProgress(){let pct=Math.round(totalAnswered()/30*100);$('#bar').style.width=pct+'%';$('#progressPercent').textContent=pct+'%';$('#progressLabel').textContent=`تمت الإجابة عن ${totalAnswered()} من 30 سؤالًا`;}
function inputFor(q){let v=answers[q.id]??'';if(q.type==='contact')return `<div class="intro-fields"><div><label class="qsub">الاسم الكامل <span class="required">*</span></label><input class="textinput" id="clientName" value="${esc(client.name||'')}" placeholder="اكتب اسمك" autocomplete="name"></div><div><label class="qsub">رقم الهاتف <span class="required">*</span></label><input class="textinput" id="clientPhone" value="${esc(client.phone||'')}" placeholder="01xxxxxxxxx" inputmode="tel" autocomplete="tel"></div></div>`;
if(q.type==='text')return `<input class="textinput" data-q="${q.id}" value="${esc(v)}" placeholder="${esc(q.ph||'اكتب إجابتك هنا')}">`;
if(q.type==='textarea')return `<textarea data-q="${q.id}" placeholder="${esc(q.ph||'اكتب إجابتك هنا')}">${esc(v)}</textarea>`;
if(q.type==='radio'||q.type==='checks'){let arr=q.type==='radio'?[v]:Array.isArray(v)?v:[];return `<div class="options">${q.opts.map((o,i)=>`<label class="option"><input type="${q.type==='radio'?'radio':'checkbox'}" name="q${q.id}" data-q="${q.id}" value="${esc(o)}" ${arr.includes(o)?'checked':''} ${q.type==='checks'&&q.max?'data-max="'+q.max+'"':''}><span>${esc(o)}</span></label>`).join('')}</div>${q.max?`<div class="qsub">اختار لحد ${q.max} صفات.</div>`:''}`;}
return '';}
function render(){finished=false;review=false;renderNav();updateProgress();let g=stages[step];$('#panel').innerHTML=`<div class="panel-head"><div><div class="eyebrow" style="color:#637d34">المرحلة ${String(step+1).padStart(2,'0')} / 06</div><h2>${g.title}</h2><p>${g.desc}</p></div><div class="stepcount">${g.range[0]}–${g.range[1]} / 30</div></div><div id="questions">${g.qs.map(q=>`<div class="field"><div class="qtitle">${q.id}. ${q.t}${q.id===1?' <span class="required">*</span>':''}</div>${q.sub?`<div class="qsub">${q.sub}</div>`:''}${inputFor(q)}</div>`).join('')}</div><div class="navrow"><button class="btn secondary" onclick="${step===0?'goWelcome()':'go('+(step-1)+')'}">${step===0?'← البداية':'→ السابق'}</button><button class="btn primary" onclick="${step===stages.length-1?'showReview()':'next()'}">${step===stages.length-1?'مراجعة الإجابات <em>↗</em>':'التالي <em>←</em>'}</button></div>`;
$('#panel').querySelectorAll('[data-q]').forEach(el=>{el.addEventListener('input',()=>{const id=el.dataset.q;if(el.type==='checkbox'){let checked=[...$('#panel').querySelectorAll(`[data-q="${id}"]:checked`)].map(x=>x.value);if(el.dataset.max&&checked.length>Number(el.dataset.max)){el.checked=false;return;}answers[id]=checked;}else if(el.type==='radio'){answers[id]=el.value;}else answers[id]=el.value;save();updateProgress();});el.addEventListener('change',()=>{if(el.type==='checkbox'||el.type==='radio'){const id=el.dataset.q;if(el.type==='checkbox')answers[id]=[...$('#panel').querySelectorAll(`[data-q="${id}"]:checked`)].map(x=>x.value);else answers[id]=el.value;save();updateProgress();}});});
const name=$('#clientName'),phone=$('#clientPhone');if(name)name.addEventListener('input',()=>{client.name=name.value;save();});if(phone)phone.addEventListener('input',()=>{client.phone=phone.value;save();});}
function go(i){step=Math.max(0,Math.min(stages.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'});}
function goWelcome(){step=0;render();window.scrollTo({top:0,behavior:'smooth'});}
function next(){if(step===0&&(!client.name?.trim()||!client.phone?.trim())){alert('من فضلك اكتب اسمك ورقم تليفونك عشان نكمل.');return;}go(step+1);}
function showReview(){if(!client.name?.trim()||!client.phone?.trim()){alert('من فضلك اكتب اسمك ورقم تليفونك في المرحلة الأولى.');go(0);return;}review=true;renderNav();updateProgress();$('#panel').innerHTML=`<div class="eyebrow" style="color:#637d34">FINAL CHECK</div><h2>راجع إجاباتك قبل الإرسال</h2><p class="qsub" style="margin-bottom:20px">تقدر ترجع لأي مرحلة وتعدّل إجاباتك قبل تنزيل الملخص.</p><div class="review-item"><b>الاسم</b><span>${esc(client.name)}</span></div><div class="review-item"><b>رقم الهاتف</b><span>${esc(client.phone)}</span></div>${stages.map((g,i)=>`<div class="review-stage"><span>${g.title}</span><button onclick="go(${i})">تعديل المرحلة ←</button></div>${g.qs.filter(q=>q.type!=='contact').map(q=>`<div class="review-item"><b>${q.id}. ${esc(q.t)}</b><span>${esc(Array.isArray(answers[q.id])?answers[q.id].join('، '):(answers[q.id]||'— لم تتم الإجابة —'))}</span></div>`).join('')}`).join('')}<div class="navrow"><button class="btn secondary" onclick="go(${stages.length-1})">→ رجوع للتعديل</button><button class="btn primary" onclick="downloadBrief()">تنزيل ملخص الإجابات <em>↓</em></button></div><p class="qsub" style="margin-top:15px">تنزيل الملخص يحفظ نسخة على جهازك فقط. هذه المعاينة لا ترسل البيانات إلى المصمم تلقائيًا.</p>`;window.scrollTo({top:0,behavior:'smooth'});}
function downloadBrief(){let out={form:'Brand Identity Brief',client,submittedAt:new Date().toISOString(),answers:{}};stages.forEach(g=>g.qs.forEach(q=>{if(q.type!=='contact')out.answers[q.id]={question:q.t,answer:answers[q.id]??''}}));let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='brand-brief-'+(client.name||'client').trim().replace(/\s+/g,'-')+'.json';a.click();URL.revokeObjectURL(url);}
render();
</script></body></html>
